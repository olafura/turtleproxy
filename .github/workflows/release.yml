name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.23
    
    - name: Get version from tag
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
    
    - name: Build binaries
      run: |
        mkdir -p dist
        
        # Linux builds
        GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/turtleproxy-linux-amd64 .
        GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dist/turtleproxy-linux-arm64 .
        
        # macOS builds  
        GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o dist/turtleproxy-darwin-amd64 .
        GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o dist/turtleproxy-darwin-arm64 .
        
        # Windows builds
        GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/turtleproxy-windows-amd64.exe .
    
    - name: Create archives
      run: |
        cd dist
        
        # Create tar.gz archives for Unix-like systems
        tar -czf turtleproxy-linux-amd64.tar.gz turtleproxy-linux-amd64
        tar -czf turtleproxy-linux-arm64.tar.gz turtleproxy-linux-arm64
        tar -czf turtleproxy-darwin-amd64.tar.gz turtleproxy-darwin-amd64
        tar -czf turtleproxy-darwin-arm64.tar.gz turtleproxy-darwin-arm64
        
        # Create zip archive for Windows
        zip turtleproxy-windows-amd64.zip turtleproxy-windows-amd64.exe
        
        # Generate checksums
        sha256sum *.tar.gz *.zip > checksums.txt
    
    - name: Generate changelog
      id: changelog
      run: |
        # Get commits since last tag
        LAST_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
        if [ -n "$LAST_TAG" ]; then
          CHANGELOG=$(git log --pretty=format:"* %s (%h)" $LAST_TAG..HEAD)
        else
          CHANGELOG=$(git log --pretty=format:"* %s (%h)")
        fi
        
        # Save changelog to file and output
        echo "$CHANGELOG" > changelog.txt
        echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
        echo "$CHANGELOG" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
    
    - name: Create Release
      uses: actions/create-release@v1
      id: create_release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.version.outputs.VERSION }}
        release_name: TurtleProxy ${{ steps.version.outputs.VERSION }}
        body: |
          ## Changes
          ${{ steps.changelog.outputs.CHANGELOG }}
          
          ## Installation
          
          Download the appropriate binary for your platform from the assets below.
          
          ### Linux/macOS
          ```bash
          # Download and extract
          tar -xzf turtleproxy-<platform>-<arch>.tar.gz
          
          # Make executable and move to PATH
          chmod +x turtleproxy-<platform>-<arch>
          sudo mv turtleproxy-<platform>-<arch> /usr/local/bin/turtleproxy
          ```
          
          ### Windows
          Extract the zip file and run `turtleproxy-windows-amd64.exe`
          
          ## Verify checksums
          ```bash
          sha256sum -c checksums.txt
          ```
        draft: false
        prerelease: false
    
    - name: Upload Release Assets
      run: |
        cd dist
        for file in *.tar.gz *.zip checksums.txt; do
          curl \
            -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"$file" \
            "${{ steps.create_release.outputs.upload_url }}=$(basename $file)"
        done
